name: Set up the Ruff workspace
description: Install uv and optionally add a locked Ruff dependency group to PATH.

inputs:
  group:
    description: Dependency group from the workflow revision to put on PATH.
    required: false
  python-version:
    description: Python version for uv to use.
    required: false
  activate-environment:
    description: Create and activate a virtual environment in the checkout.
    default: "false"
  enable-cache:
    description: Enable the uv cache for the checkout (true, false, or auto).
    default: "false"
  cache-python:
    description: Include uv-managed Python installations in the cache.
    default: "false"
  save-cache:
    description: Save the uv cache after the job (true, false, or auto).
    default: "auto"

runs:
  using: composite
  steps:
    - name: Select the uv release archive
      id: release
      shell: bash
      run: |
        case "$RUNNER_OS/$RUNNER_ARCH" in
          Linux/X64)
            uv_version="0.13.6"
            uv_checksum="f29c3e94ffabd7e6f3ba521dba169a9b7ec12100bf3257087f0f24f6123f3645"
            ;;
          Linux/ARM64)
            uv_version="0.13.6"
            uv_checksum="229e194255c7958d86d56e8790d969a6f74736592133f0dfd0076f754c642c1d"
            ;;
          macOS/ARM64)
            uv_version="0.13.6"
            uv_checksum="60fbd5c8a1ed681845eea28d9d622fcde03c51e91a43465b64a1e17db1ed3472"
            ;;
          Windows/X64)
            uv_version="0.13.6"
            uv_checksum="a2a8820d5eea32f08ef467ef3b7f66883a9b076d5737a2fc2fbb5f458d1bb50f"
            ;;
          *)
            echo "Unsupported uv runner: $RUNNER_OS/$RUNNER_ARCH" >&2
            exit 1
            ;;
        esac
        {
          echo "version=$uv_version"
          echo "checksum=$uv_checksum"
        } >> "$GITHUB_OUTPUT"

    - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      with:
        version: ${{ steps.release.outputs.version }}
        checksum: ${{ steps.release.outputs.checksum }}
        python-version: ${{ inputs.python-version }}
        activate-environment: ${{ inputs.activate-environment }}
        enable-cache: ${{ inputs.enable-cache }}
        cache-python: ${{ inputs.cache-python }}
        save-cache: ${{ inputs.save-cache }}
        working-directory: ${{ (inputs.enable-cache != 'false' || inputs.activate-environment == 'true') && github.workspace || github.action_path }}
        tool-bin-dir: ${{ inputs.group && format('{0}/.venv/{1}', github.action_path, runner.os == 'Windows' && 'Scripts' || 'bin') || '' }}

    - name: Install the toolchain group
      if: inputs.group != ''
      shell: bash
      # Use the workflow revision's lockfile, including in jobs without a checkout.
      working-directory: ${{ github.action_path }}/../../..
      env:
        TOOLCHAIN_GROUP: ${{ inputs.group }}
        UV_PROJECT_ENVIRONMENT: ${{ github.action_path }}/.venv
      run: |
        # Keep executables on PATH independent of the writable uv cache.
        uv sync --locked --only-group "$TOOLCHAIN_GROUP" --python "${UV_PYTHON:-3}" --link-mode copy
