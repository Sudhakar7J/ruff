name: Set up jaq
description: Add the locked Astral dev toolchain build of jaq to PATH on Linux x86-64.

runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      with:
        # renovate: datasource=github-release-attachments depName=astral-sh/uv
        version: "0.13.6"
        checksum: "f29c3e94ffabd7e6f3ba521dba169a9b7ec12100bf3257087f0f24f6123f3645"
        enable-cache: false
        working-directory: ${{ github.action_path }}
        tool-bin-dir: ${{ github.action_path }}/bin

    - name: Install jaq
      shell: bash
      # Use the workflow revision's lockfile, including in jobs without a checkout.
      working-directory: ${{ github.action_path }}/../../..
      env:
        UV_PROJECT_ENVIRONMENT: ${{ github.action_path }}/.venv
      run: |
        uv sync --locked --only-group jaq --python 3
        install -Dm755 "$UV_PROJECT_ENVIRONMENT/bin/jaq" "$UV_TOOL_BIN_DIR/jaq"
